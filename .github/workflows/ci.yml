# Build libx11-compat, run the regression suite, exercise Motif and
# Osiris against the compat stack, and gate on lint / sanitizer findings.
# Action versions track the latest major release (no SHA pinning); the
# LLVM apt repo is added so clang-format-20 is available on ubuntu-24.04
# (which ships clang-format-18 by default).
#
# Top-level jobs (lint, build, debug-build, sanitize, motif, osiris,
# xfig, xwpe, xephem, gimp, gtk1, cinepaint, xmms, grace, sdl3) run in
# parallel. The sdl3 job builds the
# compat stack against the native SDL3 backend (SDL_BACKEND=sdl3); every
# other job uses the default SDL2 backend, so the SDL3 translation shim in
# src/sdl-compat.h is only exercised there. Osiris and Xfig each have no Motif
# dependency, so they live in their own jobs rather than queueing behind
# the Motif + ViolaWWW + Mosaic chain. GIMP 0.54 is a Motif client but
# gets its own job too: its plug-in build pulls in libpng/jpeg/tiff that
# the Motif chain does not need. The Xft and Xaw link tests
# (test-xft-link, test-libxaw-link) run as part of make check-unit in
# the build / debug-build / sanitize jobs, so the Athena-stack link
# surface is gated even when the dedicated xfig job is skipped.
# Cross-run state that's deterministic by content hash is cached: the
# upstream tarball + extracted-header tree under build/upstream/, the
# thentenaar/motif, thentenaar/mosaic-ng, osiris, and xfig clones, and
# per-job ccache directories for C object reuse.
#
# Screenshot differential gates (Motif / ViolaWWW / Mosaic / Osiris /
# Xfig / GIMP / XNEdit / xwpe / XEphem / XCircuit / Grace / XMMS vs.
# system libX11) live in differential.yml. They run in
# parallel with this workflow on the same trigger so PR feedback is
# not blocked by the heavier double-build pipeline.
name: CI

on:
  push:
    branches: [main, cicd]
  pull_request:
    branches: [main]

# Newer pushes cancel older PR runs so a force-push doesn't queue stale
# work. Main-branch pushes are NOT cancelled so every commit landing on
# main gets a completed CI record and a cache-save pass.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  COMMON_BUILD_PKGS: "clang ccache make pkg-config python3 libsdl2-dev libsdl2-ttf-dev libpixman-1-dev"
  MOTIF_BUILD_PKGS: "autoconf automake libtool bison flex gawk m4"
  # Osiris (Qt 2.3.2 fork) configures with Meson and builds with Ninja,
  # and Osiris itself hard-depends on libjpeg, libpng, and freetype for
  # image loading + font rendering (the xft/opengl/sm probes are gated
  # off by compat/osiris-patches/, but image/font are core). None of
  # these are pulled in by COMMON_BUILD_PKGS, so install them in the
  # osiris job (the only job that runs `make osiris`).
  OSIRIS_BUILD_PKGS: "meson ninja-build libjpeg-dev libpng-dev libfreetype-dev"
  # GIMP 0.54's image-format plug-ins (plug-ins/{png,jpeg}) link the system
  # format libraries into the standalone plug-in executables, never into the
  # compat .so, so the SDL2/SDL2_ttf/pixman core-dep boundary is preserved.
  # zlib1g-dev backs libpng's -lz. TIFF is dropped on purpose (see
  # compat/gimp-patches/0012-plugins-drop-tiff.patch), so no libtiff-dev. The
  # GIMP autoconf step also needs the MOTIF_BUILD_PKGS chain (autoconf + the
  # bundled Motif build).
  GIMP_BUILD_PKGS: "libpng-dev libjpeg-dev zlib1g-dev"
  # GTK1 configures through CMake; python3-pil backs replay image assertions.
  GTK1_BUILD_PKGS: "cmake g++ python3-pil"
  # CinePaint configures through CMake and its PNG/JPEG plug-ins link the
  # system image libraries.
  CINEPAINT_BUILD_PKGS: "cmake g++ libpng-dev libjpeg-dev zlib1g-dev python3-pil"
  # xwpe builds its DAP debug client against json-c and its terminal backend
  # against ncursesw, neither pulled in by COMMON_BUILD_PKGS, and runs
  # autoreconf (so it also needs the MOTIF_BUILD_PKGS autotools chain).
  # python3-pil backs the replay smoke's image assertions; the smoke runs fully
  # offscreen, so no Xvfb or screenshot tool from DIFFERENTIAL_PKGS is needed.
  XWPE_BUILD_PKGS: "libjson-c-dev libncurses-dev python3-pil"
  # XEphem links OpenSSL for its network catalog fetches (the bundled libpng /
  # libz / libjpegd / libastro support libs build from XEphem's own source, so
  # no system image libs are needed), and runs autoreconf for the bundled Motif
  # (MOTIF_BUILD_PKGS). python3-pil backs the offscreen replay smoke.
  XEPHEM_BUILD_PKGS: "libssl-dev python3-pil"
  # Grace (xmgrace) builds against the bundled Motif; its configure disables the
  # netcdf / jpeg / png / pdf drivers and the f77 wrapper and uses the bundled
  # t1lib, so no image or numeric system libs are pulled in beyond the Motif
  # chain. python3-pil backs the offscreen replay smoke's image assertions.
  GRACE_BUILD_PKGS: "python3-pil"
  DIFFERENTIAL_PKGS: "imagemagick openssh-client python3-pil rsync xauth xvfb"

jobs:
  # ---- Lint: formatting, newline, security, cppcheck ----
  lint:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install LLVM 20 apt source
        # Drop the GPG key in /usr/share/keyrings/ and reference it with
        # signed-by= so trust is scoped to the LLVM repo instead of every
        # other source apt sees. Use the HTTPS endpoint so the package
        # download itself isn't sent in the clear.
        run: |
          set -e
          sudo install -d -m 0755 /usr/share/keyrings
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo tee /usr/share/keyrings/llvm-archive-keyring.asc >/dev/null
          sudo chmod 0644 /usr/share/keyrings/llvm-archive-keyring.asc
          codename=$(. /etc/os-release && echo "$VERSION_CODENAME")
          echo "deb [signed-by=/usr/share/keyrings/llvm-archive-keyring.asc] https://apt.llvm.org/${codename}/ llvm-toolchain-${codename}-20 main" \
            | sudo tee /etc/apt/sources.list.d/llvm-20.list >/dev/null

      - name: Install lint tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang-format-20 cppcheck file shfmt

      - name: Confirm tool versions
        run: |
          clang-format-20 --version
          shfmt --version

      - name: Check trailing newline
        run: .ci/check-newline.sh

      - name: Check clang-format
        env:
          CLANG_FORMAT: clang-format-20
        run: .ci/check-format.sh

      - name: Check shell formatting (shfmt)
        # shfmt picks up the [*.sh] section of .editorconfig so the
        # style stays in lockstep with `make check-format`.
        run: shfmt -d $(git ls-files -- '*.sh')

      - name: Security checks
        run: .ci/check-security.sh

      - name: Static analysis (cppcheck)
        # Pre-existing findings (memleak / doubleFree / va_end / syntaxError on
        # SDL_VERSION_ATLEAST) still need triage. Keep the step non-blocking
        # for now so the report surfaces in CI logs; flip to required once
        # the backlog is cleared or suppressed inline.
        continue-on-error: true
        run: .ci/check-cppcheck.sh

  # ---- Release build + regression tests + bundled examples ----
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ${{ env.COMMON_BUILD_PKGS }} ${{ env.MOTIF_BUILD_PKGS }} \
            ${{ env.DIFFERENTIAL_PKGS }}

      - name: Cache upstream tarballs and extracted source/headers
        # Cache only the inputs that derive from sync-upstream-headers.py
        # (downloaded tarballs, extracted X11 headers, extracted upstream
        # .c source slices). Exclude the .o / .d build artifacts that
        # appear alongside the sources: those are CFLAGS-sensitive and
        # sharing them across release / debug / sanitize jobs would let
        # one job's compiled objects substitute for another's. Also
        # exclude motif-src which has its own cache below.
        uses: actions/cache@v6
        with:
          path: |
            build/upstream
            !build/upstream/**/*.o
            !build/upstream/**/*.d
            !build/upstream/motif
            !build/upstream/mosaic
            !build/upstream/osiris
            !build/upstream/xfig-*
            !build/upstream/.cache/xfig-*
            !build/upstream/gimp-*
            !build/upstream/.cache/gimp-*
          key: upstream-src-v2-${{ runner.os }}-${{ hashFiles('scripts/sync-upstream-headers.py') }}
          restore-keys: |
            upstream-src-v2-${{ runner.os }}-

      - name: Cache ccache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ccache
          key: ccache-build-v2-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-build-v2-${{ runner.os }}-

      - name: Configure ccache
        run: |
          ccache --max-size=400M
          ccache --zero-stats
          echo "CC=ccache clang" >>"$GITHUB_ENV"

      - name: Build libX11-compat.so
        run: make -j"$(nproc)"

      - name: Run regression tests (make check-unit)
        # check-unit is the sanitizer-friendly subset: in-tree binaries
        # + symbol-coverage, no motif/violawww gates. The motif job below
        # owns the heavy integration gates (check-link-motif,
        # check-demos-motif, check-smoke) with the MOTIF_DEMO_SKIP env
        # this job does not set. Screenshot differential gates live in
        # differential.yml.
        env:
          UI_REPLAY_XVFB: --xvfb
          UI_REPLAY_SCREENSHOT_COMMAND: import
          UI_REPLAY_DISPLAY: 121
        run: make check-unit

      - name: Build bundled examples
        run: make examples -j"$(nproc)"

      - name: ccache stats
        run: ccache --show-stats

  # ---- Debug build runs in parallel with release ----
  debug-build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ${{ env.COMMON_BUILD_PKGS }} ${{ env.MOTIF_BUILD_PKGS }} \
            ${{ env.DIFFERENTIAL_PKGS }}

      - name: Cache upstream tarballs and extracted source/headers
        # Cache only the inputs that derive from sync-upstream-headers.py
        # (downloaded tarballs, extracted X11 headers, extracted upstream
        # .c source slices). Exclude the .o / .d build artifacts that
        # appear alongside the sources: those are CFLAGS-sensitive and
        # sharing them across release / debug / sanitize jobs would let
        # one job's compiled objects substitute for another's. Also
        # exclude motif-src which has its own cache below.
        uses: actions/cache@v6
        with:
          path: |
            build/upstream
            !build/upstream/**/*.o
            !build/upstream/**/*.d
            !build/upstream/motif
            !build/upstream/mosaic
            !build/upstream/osiris
            !build/upstream/xfig-*
            !build/upstream/.cache/xfig-*
            !build/upstream/gimp-*
            !build/upstream/.cache/gimp-*
          key: upstream-src-v2-${{ runner.os }}-${{ hashFiles('scripts/sync-upstream-headers.py') }}
          restore-keys: |
            upstream-src-v2-${{ runner.os }}-

      - name: Cache ccache
        # Separate key from the release job so the debug
        # -DDEBUG_LIBX11_COMPAT objects don't collide with release builds.
        uses: actions/cache@v6
        with:
          path: ~/.cache/ccache
          key: ccache-debug-v2-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-debug-v2-${{ runner.os }}-

      - name: Configure ccache
        run: |
          ccache --max-size=400M
          ccache --zero-stats
          echo "CC=ccache clang" >>"$GITHUB_ENV"

      - name: Build with DEBUG_LIBX11_COMPAT
        run: make CFLAGS_EXTRA=-DDEBUG_LIBX11_COMPAT -j"$(nproc)"

      - name: Run regression tests (debug)
        # check-unit only: the umbrella check would recursively run
        # check-demos-motif, which segfaults on programs/Tree/tree on
        # this image. The motif job runs the full check with the
        # MOTIF_DEMO_SKIP env that makes that demo opt-out.
        env:
          UI_REPLAY_XVFB: --xvfb
          UI_REPLAY_SCREENSHOT_COMMAND: import
          UI_REPLAY_DISPLAY: 121
        run: make CFLAGS_EXTRA=-DDEBUG_LIBX11_COMPAT check-unit

      - name: ccache stats
        run: ccache --show-stats

  # ---- Run make check with AddressSanitizer + UndefinedBehaviorSanitizer ----
  sanitize:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ${{ env.COMMON_BUILD_PKGS }} ${{ env.MOTIF_BUILD_PKGS }} \
            ${{ env.DIFFERENTIAL_PKGS }}

      - name: Cache upstream tarballs and extracted source/headers
        # Cache only the inputs that derive from sync-upstream-headers.py
        # (downloaded tarballs, extracted X11 headers, extracted upstream
        # .c source slices). Exclude the .o / .d build artifacts that
        # appear alongside the sources: those are CFLAGS-sensitive and
        # sharing them across release / debug / sanitize jobs would let
        # one job's compiled objects substitute for another's. Also
        # exclude motif-src which has its own cache below.
        uses: actions/cache@v6
        with:
          path: |
            build/upstream
            !build/upstream/**/*.o
            !build/upstream/**/*.d
            !build/upstream/motif
            !build/upstream/mosaic
            !build/upstream/osiris
            !build/upstream/xfig-*
            !build/upstream/.cache/xfig-*
            !build/upstream/gimp-*
            !build/upstream/.cache/gimp-*
          key: upstream-src-v2-${{ runner.os }}-${{ hashFiles('scripts/sync-upstream-headers.py') }}
          restore-keys: |
            upstream-src-v2-${{ runner.os }}-

      - name: Cache ccache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ccache
          key: ccache-sanitize-v2-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-sanitize-v2-${{ runner.os }}-

      - name: Configure ccache
        # Sanitizer flag set defines the cache key partition for ccache,
        # which is what we want: sanitizer .o files must not collide
        # with the release / debug caches.
        run: |
          ccache --max-size=400M
          ccache --zero-stats
          echo "CC=ccache clang" >>"$GITHUB_ENV"

      - name: Build and test with ASan + UBSan
        env:
          # Both library and test binaries are compiled with the same
          # sanitizer flags so the runtime loaded by the test binary
          # services the .so as well. -fno-sanitize-recover=undefined
          # turns UBSan findings into hard failures.
          SAN_FLAGS: "-fsanitize=address,undefined -fno-sanitize-recover=undefined -fno-omit-frame-pointer -g -O1"
          UI_REPLAY_XVFB: --xvfb
          UI_REPLAY_SCREENSHOT_COMMAND: import
          UI_REPLAY_DISPLAY: 121
          # SDL2's dummy driver retains pools across XCloseDisplay, so
          # leak detection produces unrelated noise. Keep memory-error
          # detection on; revisit leaks separately.
          # detect_odr_violation=0: libXaw deliberately overrides
          # libXt's vendorShellClassRec (Vendor.c:158) so the Athena
          # VendorShell behaves correctly when both libraries are
          # loaded. ELF + ASan flags the duplicate definition as an
          # ODR violation, but this is the documented Athena hook
          # point; turn detection off so the rest of the sanitize
          # surface stays gated.
          ASAN_OPTIONS: detect_leaks=0:detect_odr_violation=0:abort_on_error=1:strict_string_checks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          make CFLAGS_EXTRA="$SAN_FLAGS" LDFLAGS="$SAN_FLAGS" -j"$(nproc)"
          # Run only the cheap unit-test subset under sanitizer. The
          # umbrella `make check` would recursively trigger motif's
          # autoconf which probes for Xutf8TextExtents via a link test
          # that fails when SAN_FLAGS leak into the upstream configure
          # ("Motif requires a UTF-8 capable libX11").
          make CFLAGS_EXTRA="$SAN_FLAGS" LDFLAGS="$SAN_FLAGS" check-unit

      - name: ccache stats
        run: ccache --show-stats

  # ---- Run the display-lock threading test under ThreadSanitizer ----
  #
  # ASan/UBSan (the sanitize job) and TSan cannot share a build, so the
  # display-lock race gate is its own job. It builds the library and the
  # check binary with -fsanitize=thread and runs only
  # test_display_lock_threads via LIBX11_COMPAT_THREAD_TEST_ONLY, offscreen
  # under the dummy driver. The rest of make check has benign SDL
  # event-thread interactions that are out of scope for this gate.
  thread-sanitize:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ${{ env.COMMON_BUILD_PKGS }} ${{ env.MOTIF_BUILD_PKGS }} \
            ${{ env.DIFFERENTIAL_PKGS }}

      - name: Cache upstream tarballs and extracted source/headers
        uses: actions/cache@v6
        with:
          path: |
            build/upstream
            !build/upstream/**/*.o
            !build/upstream/**/*.d
            !build/upstream/motif
            !build/upstream/mosaic
            !build/upstream/osiris
            !build/upstream/xfig-*
            !build/upstream/.cache/xfig-*
            !build/upstream/gimp-*
            !build/upstream/.cache/gimp-*
          key: upstream-src-v2-${{ runner.os }}-${{ hashFiles('scripts/sync-upstream-headers.py') }}
          restore-keys: |
            upstream-src-v2-${{ runner.os }}-

      - name: Cache ccache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ccache
          key: ccache-tsan-v2-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-tsan-v2-${{ runner.os }}-

      - name: Configure ccache
        run: |
          ccache --max-size=400M
          ccache --zero-stats
          echo "CC=ccache clang" >>"$GITHUB_ENV"

      - name: Build and run the display-lock threading test under TSan
        env:
          TSAN_FLAGS: "-fsanitize=thread -fno-omit-frame-pointer -g -O1"
          # A data race aborts the process (non-zero exit fails the job).
          TSAN_OPTIONS: halt_on_error=1
        run: |
          make CFLAGS_EXTRA="$TSAN_FLAGS" LDFLAGS="$TSAN_FLAGS" \
            -j"$(nproc)" build/tests/check
          SDL_VIDEODRIVER=dummy LIBX11_COMPAT_THREAD_TEST_ONLY=1 \
            ./build/tests/check

      - name: ccache stats
        run: ccache --show-stats

  # ---- Motif, ViolaWWW, Mosaic integration and validation ----
  #
  # Build the thentenaar/motif libXm and libMrm against the compat stack,
  # build every Motif demo program, and run the demo smoke checks
  # (validate-motif-demos.sh launches each demo briefly and asserts no
  # fatal output / abnormal exit). ViolaWWW and Mosaic are also built
  # locally against the compat stack and exercised under Xvfb via the
  # replay-driven smoke checks. The system-libX11 screenshot diff lives
  # in differential.yml.
  motif:
    runs-on: ubuntu-24.04
    env:
      # Ubuntu's bison package installs /usr/bin/bison but no /usr/bin/yacc;
      # the Mrm parser generation in mk/motif.mk defaults to invoking `yacc`
      # so point it at bison's yacc-compatibility mode instead of adding
      # byacc as a build dep.
      MOTIF_YACC: "bison -y"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ${{ env.COMMON_BUILD_PKGS }} ${{ env.MOTIF_BUILD_PKGS }} \
            ${{ env.DIFFERENTIAL_PKGS }}

      - name: Cache upstream tarballs and extracted source/headers
        # Same cache as the other compile jobs use, scoped to
        # sync-upstream-headers.py and stripped of CFLAGS-sensitive build
        # artifacts so this job and the release / debug / sanitize jobs
        # can share warm extractions safely.
        uses: actions/cache@v6
        with:
          path: |
            build/upstream
            !build/upstream/**/*.o
            !build/upstream/**/*.d
            !build/upstream/motif
            !build/upstream/mosaic
            !build/upstream/osiris
            !build/upstream/xfig-*
            !build/upstream/.cache/xfig-*
            !build/upstream/gimp-*
            !build/upstream/.cache/gimp-*
          key: upstream-src-v2-${{ runner.os }}-${{ hashFiles('scripts/sync-upstream-headers.py') }}
          restore-keys: |
            upstream-src-v2-${{ runner.os }}-

      - name: Cache Motif source clone and autoreconf output
        # Exact-match key only (no restore-keys fallback). The Motif
        # source stamp doesn't depend on mk/motif.mk or the patches, so
        # a fallback restore could leave a stale clone+autoreconf in
        # place when the inputs changed; missing the cache and rebuilding
        # from scratch is the safer default for any drift.
        uses: actions/cache@v6
        with:
          path: build/upstream/motif
          key: motif-src-${{ runner.os }}-${{ hashFiles('mk/motif.mk', 'compat/motif-patches/**') }}

      - name: Cache Mosaic source clone
        # Exact-match key only. Mosaic patches are applied to a throwaway
        # work tree, but the source stamp is pinned by mk/mosaic.mk, so a
        # stale fallback clone would hide revision or patch-input drift.
        uses: actions/cache@v6
        with:
          path: build/upstream/mosaic
          key: mosaic-src-${{ runner.os }}-${{ hashFiles('mk/mosaic.mk', 'compat/mosaic-patches/**') }}

      - name: Cache ccache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ccache
          key: ccache-motif-v2-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-motif-v2-${{ runner.os }}-

      - name: Configure ccache
        run: |
          ccache --max-size=600M
          ccache --zero-stats
          echo "CC=ccache clang" >>"$GITHUB_ENV"

      - name: Build libX11-compat (prerequisite for Motif)
        run: make -j"$(nproc)"

      - name: Build Motif libXm and libMrm against compat stack
        run: make motif -j"$(nproc)"

      - name: Build Motif demos
        run: make motif-demos -j"$(nproc)"

      # Render unmodified paperplane (Motif GLwDrawingArea + immediate-mode
      # desktop GL) through libx11-compat over the system Mesa provider
      # (surfaceless EGL under Xvfb) and assert its canvas paints, not a black
      # frame. This is the one GL render test that needs the Motif build, so it
      # rides this job; the Mesa EGL/GLES provider deps are pulled in here since
      # the rest of the Motif build does not need them. Exercises the
      # offscreen-pbuffer readback/composite path for a child GL widget.
      - name: Render paperplane (Motif GLwDrawingArea, surfaceless Mesa)
        run: |
          sudo apt-get install -y --no-install-recommends \
            libegl-dev libgles-dev libgl1-mesa-dri xvfb
          echo "provider libEGL: $(clang -print-file-name=libEGL.so)"
          ls -l "$(clang -print-file-name=libEGL.so)" 2>&1 || true
          make check-paperplane-linux || {
            # On failure, capture what the headless GL path actually bound to:
            # the demo log, /dev/dri (GPU vs llvmpipe), and the surfaceless GLES
            # renderer (tests/egl-renderer-probe.c). Enough to tell a provider or
            # renderer regression from the occasional slow-first-frame miss the
            # render retry already absorbs.
            echo "=== glx-snapshot-run.log ==="; cat /tmp/glx-snapshot-run.log 2>/dev/null || true
            echo "=== /dev/dri (GPU vs llvmpipe) ==="; ls -la /dev/dri 2>&1 || echo "NO /dev/dri"
            echo "=== surfaceless GLES renderer ==="
            clang tests/egl-renderer-probe.c -lEGL -lGLESv2 -o /tmp/rend 2>/dev/null \
              && EGL_PLATFORM=surfaceless /tmp/rend 2>&1 || echo "renderer probe failed"
            exit 1
          }

      - name: Upload paperplane render on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: paperplane-linux
          path: build/paperplane-linux.png
          if-no-files-found: warn
          retention-days: 7

      - name: Run Motif demo smoke checks
        env:
          SDL_VIDEODRIVER: dummy
          # Known-failure skip list. Each entry is the demo path relative
          # to demos/ as it appears in RUN lines. Remove an entry once
          # the underlying compat-layer issue is fixed and verified.
          #
          # programs/Tree/tree: segfaults during startup. First surfaced
          # by run 27019075196; root cause TBD. Until we have the actual
          # crash log (uploaded by the next step on failure), skip so
          # the rest of the smoke set can keep gating.
          MOTIF_DEMO_SKIP: "programs/Tree/tree"
        run: make check-demos-motif

      - name: Upload Motif demo logs on failure
        # Captures every demo's per-run log so a future regression can be
        # triaged from the actual stderr instead of just the exit status.
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: motif-demo-logs
          path: build/motif-demo-logs
          if-no-files-found: warn
          retention-days: 7

      - name: Build ViolaWWW against compat stack
        id: violawww
        # Build the bolknote/violawww browser against libx11-compat +
        # libXt-compat + libXpm-compat + libXmu-compat + bundled Motif.
        # This is a build-only smoke gate: the source is cloned at the
        # pinned commit in mk/violawww.mk and compiled. A clean build
        # verifies the full Xt + Motif + Xext surface the demos alone
        # don't cover (e.g. selection helpers, XmuConvertStandard, Xpm
        # pixmap loaders). The full per-step log is written to
        # build/violawww/build.log and uploaded on failure.
        #
        # !cancelled() runs this step even if check-demos-motif above
        # failed, so the build steps report independently. A workflow
        # cancellation still aborts.
        if: ${{ !cancelled() }}
        run: make violawww

      - name: Build Mosaic against compat stack
        id: mosaic
        # Builds thentenaar/mosaic-ng at the pinned revision against
        # libx11-compat, libXt-compat, libXmu-compat, libXpm-compat,
        # libXext-compat, and the bundled Motif. Keep this separate
        # from check-smoke so the documented smoke aggregate remains
        # the Motif + ViolaWWW gate developers expect locally.
        if: ${{ !cancelled() }}
        run: make mosaic

      - name: Run Motif and ViolaWWW replay smoke checks
        # make check-smoke is intentionally usable without Xvfb/xdotool on a
        # developer machine. GitHub-hosted runners are headless, so CI opts
        # into Xvfb explicitly for deterministic screenshots while still using
        # the in-process LIBX11_COMPAT_REPLAY input backend. ViolaWWW was built
        # in the previous step, so clear its smoke prerequisite only when that
        # build actually succeeded; otherwise the smoke would fail later with a
        # missing vw binary and obscure the build failure.
        if: ${{ !cancelled() && steps.violawww.outcome == 'success' }}
        env:
          UI_REPLAY_XVFB: --xvfb
          UI_REPLAY_SCREENSHOT_COMMAND: import
          UI_REPLAY_DISPLAY: 121
          VIOLAWWW_SMOKE_DEPS: ""
        run: make check-smoke

      - name: Run Mosaic replay smoke checks
        # Mosaic has a dedicated smoke target so adding the browser as a
        # validation target does not make make check-smoke heavier or
        # network-dependent for local users. The replays exercise initial
        # paint, scrolling, hyperlink navigation, and URL-field editing.
        if: ${{ !cancelled() && steps.mosaic.outcome == 'success' }}
        env:
          UI_REPLAY_XVFB: --xvfb
          UI_REPLAY_SCREENSHOT_COMMAND: import
          UI_REPLAY_DISPLAY: 122
        run: make check-smoke-mosaic

      - name: Upload ViolaWWW build log on failure
        # Upload only when this specific step failed. A bare
        # `if: failure()` would also fire on an earlier failure (e.g.
        # check-demos-motif) and attach a successful ViolaWWW log,
        # which would be a misleading artifact.
        if: ${{ failure() && steps.violawww.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: violawww-build-log
          path: build/violawww/build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Mosaic build log on failure
        if: ${{ failure() && steps.mosaic.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: mosaic-build-log
          path: build/mosaic/build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Upload UI smoke artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ui-smoke
          path: build/ui-smoke
          if-no-files-found: warn
          retention-days: 7

      - name: ccache stats
        # Always log ccache stats so we can see whether earlier-step
        # failures still produced cache activity. !cancelled() keeps
        # this gated on workflow cancellation while running through
        # both demo and violawww failures.
        if: ${{ !cancelled() }}
        run: ccache --show-stats

  # ---- Osiris (Qt 2.3.2 fork) integration and validation ----
  #
  # Osiris targets libX11-compat, libXext-compat, libXmu-compat, and the
  # link-only libICE-compat / libSM-compat shims, with no Motif coupling.
  # Splitting it out of the motif job lets the Qt2 build, demo smoke,
  # and replay smoke run in parallel with the Motif + ViolaWWW + Mosaic
  # chain instead of queueing behind it. Osiris differential screenshot
  # comparison lives in differential.yml.
  osiris:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install build dependencies
        # No MOTIF_BUILD_PKGS here: Osiris configures with Meson and
        # builds with Ninja, so it doesn't need the autoconf / automake
        # / libtool / bison / flex chain the Motif autoreconf step uses.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ${{ env.COMMON_BUILD_PKGS }} ${{ env.OSIRIS_BUILD_PKGS }} \
            ${{ env.DIFFERENTIAL_PKGS }}

      - name: Cache upstream tarballs and extracted source/headers
        # Same cache as the other compile jobs use, scoped to
        # sync-upstream-headers.py and stripped of CFLAGS-sensitive build
        # artifacts so this job and the release / debug / sanitize jobs
        # can share warm extractions safely.
        uses: actions/cache@v6
        with:
          path: |
            build/upstream
            !build/upstream/**/*.o
            !build/upstream/**/*.d
            !build/upstream/motif
            !build/upstream/mosaic
            !build/upstream/osiris
            !build/upstream/xfig-*
            !build/upstream/.cache/xfig-*
            !build/upstream/gimp-*
            !build/upstream/.cache/gimp-*
          key: upstream-src-v2-${{ runner.os }}-${{ hashFiles('scripts/sync-upstream-headers.py') }}
          restore-keys: |
            upstream-src-v2-${{ runner.os }}-

      - name: Cache Osiris source clone
        # Exact-match key only. Patch inputs feed into the Osiris build
        # stamp, so a fallback would risk applying an older patch set to
        # the pinned revision; re-cloning is the safe default on drift.
        uses: actions/cache@v6
        with:
          path: build/upstream/osiris
          key: osiris-src-${{ runner.os }}-${{ hashFiles('mk/osiris.mk', 'compat/osiris-patches/**') }}

      - name: Cache ccache
        # Distinct key from the motif job so the Osiris .o set doesn't
        # collide with Motif / ViolaWWW / Mosaic objects compiled with a
        # different include path.
        uses: actions/cache@v6
        with:
          path: ~/.cache/ccache
          key: ccache-osiris-v2-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-osiris-v2-${{ runner.os }}-

      - name: Configure ccache
        run: |
          ccache --max-size=400M
          ccache --zero-stats
          echo "CC=ccache clang" >>"$GITHUB_ENV"

      - name: Build Osiris against compat stack
        id: osiris
        # Fetch, patch, configure (Meson), and build (Ninja) the Osiris
        # Qt 2.3.2 fork against libX11-compat, libXext-compat,
        # libXmu-compat, and the link-only libICE-compat / libSM-compat
        # shims. mk/osiris.mk declares libX11-compat and friends as
        # prerequisites, so a single `make osiris` builds only what
        # Osiris needs rather than the full default target set. The build
        # closure stays SDL2 + SDL2_ttf + pixman thanks to
        # compat/osiris-patches/ disabling Xft/OpenGL/SM/MNG/GIF feature
        # probes. Build log lives at build/osiris/build.log and is
        # uploaded on failure.
        run: make osiris -j"$(nproc)"

      - name: Run Osiris demo smoke checks
        id: osiris-demos
        # Launches each built tutorial / non-GL example long enough to
        # catch startup crashes (validate-osiris-demos.sh). Headless
        # under SDL's dummy driver, so no Xvfb is needed for this step.
        if: ${{ !cancelled() && steps.osiris.outcome == 'success' }}
        env:
          SDL_VIDEODRIVER: dummy
        run: make check-demos-osiris

      - name: Run Osiris replay smoke checks
        # Replay-driven t1 and Qt Designer menu smoke checks. This job
        # owns its own runner, so display 121 is safe; no collision with
        # Motif (121) or Mosaic (122) in the motif job.
        if: ${{ !cancelled() && steps.osiris.outcome == 'success' }}
        env:
          UI_REPLAY_XVFB: --xvfb
          UI_REPLAY_SCREENSHOT_COMMAND: import
          UI_REPLAY_DISPLAY: 121
        run: make check-smoke-osiris

      - name: Upload Osiris build log on failure
        # Captures the Meson configure + Ninja build log so a future
        # patch / revision drift can be triaged without rerunning the
        # whole job locally.
        if: ${{ failure() && steps.osiris.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: osiris-build-log
          path: |
            build/osiris/build.log
            build/osiris/build/meson-logs
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Osiris demo logs on failure
        # validate-osiris-demos.sh writes one log per demo so a startup
        # crash can be triaged from the actual stderr.
        if: ${{ failure() && steps.osiris-demos.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: osiris-demo-logs
          path: build/osiris-demo-logs
          if-no-files-found: warn
          retention-days: 7

      - name: Upload UI smoke artifacts on failure
        # Distinct artifact name from the motif job's ui-smoke so both
        # jobs can upload concurrently without overwriting each other.
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ui-smoke-osiris
          path: build/ui-smoke
          if-no-files-found: warn
          retention-days: 7

      - name: ccache stats
        if: ${{ !cancelled() }}
        run: ccache --show-stats

  # ---- Xfig (Athena vector drawing) integration and validation ----
  #
  # Xfig 3.2.9a builds against libX11-compat, libXt-compat, libXmu-compat,
  # libXft-compat, and the bundled libXaw, with no Motif coupling. The
  # job builds the binary and runs the replay-driven xfig-startup smoke
  # check. The Xft and Xaw API link gates (test-xft-link,
  # test-libxaw-link) are not duplicated here: they ride the make
  # check-unit invocations in the build / debug-build / sanitize jobs
  # above. Xfig differential screenshot comparison lives in
  # differential.yml.
  xfig:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install build dependencies
        # Xfig ships a pre-generated configure script (no autoreconf
        # step), so MOTIF_BUILD_PKGS is not pulled in here.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ${{ env.COMMON_BUILD_PKGS }} \
            ${{ env.DIFFERENTIAL_PKGS }}

      - name: Cache upstream tarballs and extracted source/headers
        uses: actions/cache@v6
        with:
          path: |
            build/upstream
            !build/upstream/**/*.o
            !build/upstream/**/*.d
            !build/upstream/motif
            !build/upstream/mosaic
            !build/upstream/osiris
            !build/upstream/xfig-*
            !build/upstream/.cache/xfig-*
            !build/upstream/gimp-*
            !build/upstream/.cache/gimp-*
          key: upstream-src-v2-${{ runner.os }}-${{ hashFiles('scripts/sync-upstream-headers.py') }}
          restore-keys: |
            upstream-src-v2-${{ runner.os }}-

      - name: Cache Xfig source tree
        # Exact-match key only. XFIG_VERSION and XFIG_SHA256 in
        # mk/xfig.mk pin the tarball, and the in-tree patches under
        # compat/xfig-patches/ are applied to that stamped tree, so a
        # fallback restore on stale inputs would risk landing newer
        # patches on an older source set.
        uses: actions/cache@v6
        with:
          path: build/upstream/xfig-3.2.9a
          key: xfig-src-${{ runner.os }}-${{ hashFiles('mk/xfig.mk', 'compat/xfig-patches/**') }}

      - name: Cache ccache
        # Distinct key from motif and osiris so the xfig .o set does not
        # collide with objects compiled with a different include path.
        uses: actions/cache@v6
        with:
          path: ~/.cache/ccache
          key: ccache-xfig-v2-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-xfig-v2-${{ runner.os }}-

      - name: Configure ccache
        run: |
          ccache --max-size=400M
          ccache --zero-stats
          echo "CC=ccache clang" >>"$GITHUB_ENV"

      - name: Build libX11-compat (prerequisite for Xfig)
        run: make -j"$(nproc)"

      - name: Build Xfig against compat stack
        id: xfig
        # mk/xfig.mk fetches Xfig 3.2.9a, applies the compat/xfig-patches/
        # set, points the linker at the build/lib-aliases/ symlink farm so
        # -lXft / -lXt / -lX11 / -lXaw resolve to the compat shims, and
        # runs the upstream configure with --without-xaw3d / --without-xi
        # / --disable-tablet. Build log lives at build/xfig/build.log and
        # is uploaded on failure.
        run: make xfig -j"$(nproc)"

      - name: Run Xfig replay smoke check
        id: xfig-smoke
        # xfig-startup replays the canvas paint under Xvfb and asserts on
        # the rendered region. Display 123 is distinct from motif (121),
        # mosaic (122), and osiris's job-local 121 so a future shared
        # runner does not collide.
        if: ${{ !cancelled() && steps.xfig.outcome == 'success' }}
        env:
          UI_REPLAY_XVFB: --xvfb
          UI_REPLAY_SCREENSHOT_COMMAND: import
          UI_REPLAY_DISPLAY: 123
        run: make check-smoke-xfig

      - name: Upload Xfig build log on failure
        if: ${{ failure() && steps.xfig.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: xfig-build-log
          path: build/xfig/build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Upload UI smoke artifacts on failure
        # Distinct artifact name from the motif and osiris jobs so
        # concurrent uploads do not overwrite each other.
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ui-smoke-xfig
          path: build/ui-smoke
          if-no-files-found: warn
          retention-days: 7

      - name: ccache stats
        if: ${{ !cancelled() }}
        run: ccache --show-stats

  # ---- xwpe (terminal-style Xft editor) integration and smoke ----
  #
  # The X Window Programming Environment builds against libX11-compat and the
  # SDL_ttf-backed libXft-compat. It runs autoreconf at configure time, links
  # json-c (DAP client) and ncursesw (terminal backend), and exercises Xrm
  # parsing, window/event paths, XIM lookup, selections, and Xft/fontconfig
  # fallback. The replay smoke runs offscreen with in-process snapshots, so no
  # Xvfb is needed; it has no differential gate yet, so it stays out of
  # differential.yml.
  xwpe:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ${{ env.COMMON_BUILD_PKGS }} \
            ${{ env.MOTIF_BUILD_PKGS }} \
            ${{ env.XWPE_BUILD_PKGS }}

      - name: Cache upstream tarballs and extracted source/headers
        uses: actions/cache@v6
        with:
          path: |
            build/upstream
            !build/upstream/**/*.o
            !build/upstream/**/*.d
            !build/upstream/motif
            !build/upstream/mosaic
            !build/upstream/osiris
            !build/upstream/xfig-*
            !build/upstream/.cache/xfig-*
            !build/upstream/gimp-*
            !build/upstream/.cache/gimp-*
            !build/upstream/xwpe
          key: upstream-src-v2-${{ runner.os }}-${{ hashFiles('scripts/sync-upstream-headers.py') }}
          restore-keys: |
            upstream-src-v2-${{ runner.os }}-

      - name: Cache xwpe source clone
        # mk/xwpe.mk pins XWPE_REVISION and applies compat/xwpe-patches/ to the
        # clone, so key on both. Exact-match only: a fallback restore on stale
        # inputs could land newer patches on an older revision.
        uses: actions/cache@v6
        with:
          path: build/upstream/xwpe
          key: xwpe-src-${{ runner.os }}-${{ hashFiles('mk/xwpe.mk', 'compat/xwpe-patches/**') }}

      - name: Cache ccache
        # Distinct key from the other workload jobs so the xwpe .o set does not
        # collide with objects compiled against a different include path.
        uses: actions/cache@v6
        with:
          path: ~/.cache/ccache
          key: ccache-xwpe-v1-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-xwpe-v1-${{ runner.os }}-

      - name: Configure ccache
        run: |
          ccache --max-size=400M
          ccache --zero-stats
          echo "CC=ccache clang" >>"$GITHUB_ENV"

      - name: Build libX11-compat (prerequisite for xwpe)
        # Stage the upstream Xorg sources serially first. On a cold cache a
        # parallel `make -j` can start compiling build/upstream/src/*.o (and the
        # libXpm objects) before the upstream sync recipe has written those .c
        # files, so prime the stamp once before fanning out.
        run: |
          make build/upstream/include/.upstream-stamp
          make -j"$(nproc)"

      - name: Build xwpe against compat stack
        id: xwpe
        # mk/xwpe.mk clones xwpe at XWPE_REVISION, applies compat/xwpe-patches/,
        # points the linker at build/xwpe/lib-aliases/ so -lX11 / -lXft / -lXext
        # resolve to the compat shims, and runs configure --without-gpm. The
        # build log lives at build/xwpe/build.log and is uploaded on failure.
        run: make xwpe -j"$(nproc)"

      - name: Run xwpe replay smoke checks
        id: xwpe-smoke
        # Offscreen in-process snapshots: xwe/xwpe startup, mouse dialog, popup
        # close, and keyboard-edit replays assert on the rendered region without
        # a display server.
        if: ${{ !cancelled() && steps.xwpe.outcome == 'success' }}
        run: make check-smoke-xwpe

      - name: Upload xwpe build log on failure
        if: ${{ failure() && steps.xwpe.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: xwpe-build-log
          path: build/xwpe/build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Upload UI smoke artifacts on failure
        # Distinct artifact name so concurrent workload uploads do not overwrite.
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ui-smoke-xwpe
          path: build/ui-smoke
          if-no-files-found: warn
          retention-days: 7

      - name: ccache stats
        if: ${{ !cancelled() }}
        run: ccache --show-stats

  # ---- XEphem (Motif astronomy application) integration and validation ----
  #
  # XEphem builds against the bundled Motif plus libXt-compat, libXext-compat,
  # libXmu-compat, and libX11-compat. It exercises a large Motif UI with Xlib
  # drawing, image/catalog loading, and OpenSSL-backed network paths while
  # keeping the upstream source unchanged. No differential gate yet, so it
  # stays out of differential.yml (cf. xwpe).
  xephem:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ${{ env.COMMON_BUILD_PKGS }} \
            ${{ env.MOTIF_BUILD_PKGS }} \
            ${{ env.XEPHEM_BUILD_PKGS }}

      - name: Cache upstream tarballs and extracted source/headers
        uses: actions/cache@v6
        with:
          path: |
            build/upstream
            !build/upstream/**/*.o
            !build/upstream/**/*.d
            !build/upstream/motif
            !build/upstream/mosaic
            !build/upstream/osiris
            !build/upstream/xfig-*
            !build/upstream/.cache/xfig-*
            !build/upstream/gimp-*
            !build/upstream/.cache/gimp-*
            !build/upstream/xephem-src
          key: upstream-src-v2-${{ runner.os }}-${{ hashFiles('scripts/sync-upstream-headers.py') }}
          restore-keys: |
            upstream-src-v2-${{ runner.os }}-

      - name: Cache XEphem source clone
        # mk/xephem.mk pins XEPHEM_REVISION and applies compat/xephem-patches/ to
        # the clone, so key on both. Exact-match only: a fallback restore on
        # stale inputs could land newer patches on an older revision.
        uses: actions/cache@v6
        with:
          path: build/upstream/xephem-src
          key: xephem-src-${{ runner.os }}-${{ hashFiles('mk/xephem.mk', 'compat/xephem-patches/**') }}

      - name: Cache ccache
        # Distinct key from the other workload jobs so the xephem .o set does not
        # collide with objects compiled against a different include path.
        uses: actions/cache@v6
        with:
          path: ~/.cache/ccache
          key: ccache-xephem-v1-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-xephem-v1-${{ runner.os }}-

      - name: Configure ccache
        run: |
          ccache --max-size=500M
          ccache --zero-stats
          echo "CC=ccache clang" >>"$GITHUB_ENV"

      - name: Build libX11-compat (prerequisite for xephem)
        # Prime the upstream stamp serially before fanning out, matching the
        # other workload jobs (a cold parallel build can race the sync recipe).
        run: |
          make build/upstream/include/.upstream-stamp
          make -j"$(nproc)"

      - name: Build xephem against Motif + compat stack
        id: xephem
        # mk/xephem.mk clones XEphem at XEPHEM_REVISION, applies
        # compat/xephem-patches/, builds the bundled Motif and XEphem's own
        # support libraries, and links the GUI against libXm + libXt-compat +
        # libX11-compat. The build log lives at build/xephem/build.log and is
        # uploaded on failure.
        run: make xephem -j"$(nproc)"

      - name: Run xephem replay smoke check
        id: xephem-smoke
        # Offscreen in-process snapshot: XEphem's Motif control window comes up,
        # renders, and survives, asserted without a display server.
        if: ${{ !cancelled() && steps.xephem.outcome == 'success' }}
        run: make check-smoke-xephem

      - name: Upload xephem build log on failure
        if: ${{ failure() && steps.xephem.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: xephem-build-log
          path: build/xephem/build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Upload UI smoke artifacts on failure
        # Distinct artifact name so concurrent workload uploads do not overwrite.
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ui-smoke-xephem
          path: build/ui-smoke
          if-no-files-found: warn
          retention-days: 7

      - name: ccache stats
        if: ${{ !cancelled() }}
        run: ccache --show-stats

  # ---- GIMP 0.54 (Motif image editor) integration and validation ----
  #
  # GIMP 0.54.1 (1996) is the last Motif-based GIMP. It builds against
  # libX11-compat, libXt-compat, libXext-compat, libXmu-compat,
  # libXpm-compat, and the bundled thentenaar/motif (libXm + libMrm), with
  # the compat/gimp-patches/ balooii LP64 rework applied. `make gimp-motif`
  # pulls in the bundled Motif build as a prerequisite, so this job carries
  # the MOTIF_BUILD_PKGS autoreconf chain and the MOTIF_YACC override like
  # the motif job, plus the libpng/jpeg/tiff dev packages the image-format
  # plug-ins link. The job builds the editor and runs the replay-driven
  # gimp-motif-startup toolbox smoke check. GIMP has no differential gate
  # yet, so it does not appear in differential.yml.
  gimp:
    runs-on: ubuntu-24.04
    env:
      # Same bison yacc-compat shim the motif job uses for the Mrm parser
      # generation; the bundled Motif is a build prerequisite of GIMP.
      MOTIF_YACC: "bison -y"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ${{ env.COMMON_BUILD_PKGS }} ${{ env.MOTIF_BUILD_PKGS }} \
            ${{ env.GIMP_BUILD_PKGS }} ${{ env.DIFFERENTIAL_PKGS }}

      - name: Cache upstream tarballs and extracted source/headers
        uses: actions/cache@v6
        with:
          path: |
            build/upstream
            !build/upstream/**/*.o
            !build/upstream/**/*.d
            !build/upstream/motif
            !build/upstream/mosaic
            !build/upstream/osiris
            !build/upstream/xfig-*
            !build/upstream/.cache/xfig-*
            !build/upstream/gimp-*
            !build/upstream/.cache/gimp-*
          key: upstream-src-v2-${{ runner.os }}-${{ hashFiles('scripts/sync-upstream-headers.py') }}
          restore-keys: |
            upstream-src-v2-${{ runner.os }}-

      - name: Cache Motif source clone and autoreconf output
        # GIMP reuses the in-tree thentenaar/motif as its libXm/libMrm
        # provider, so cache the same clone+autoreconf the motif job does.
        # Exact-match key only, matching the motif job's rationale.
        uses: actions/cache@v6
        with:
          path: build/upstream/motif
          key: motif-src-${{ runner.os }}-${{ hashFiles('mk/motif.mk', 'compat/motif-patches/**') }}

      - name: Cache GIMP source tree
        # Exact-match key only. GIMP_VERSION / GIMP_SHA256 in
        # mk/gimp-motif.mk pin the tarball, and the compat/gimp-patches/
        # set is applied to a throwaway work tree (build/gimp-motif/source),
        # so the extracted tree here stays pristine. Cache the tarball too
        # so a cache hit avoids both the re-download and the re-extract.
        uses: actions/cache@v6
        with:
          path: |
            build/upstream/gimp-0.54.1
            build/upstream/.cache/gimp-0.54.1.fixed.tar.gz
          key: gimp-src-${{ runner.os }}-${{ hashFiles('mk/gimp-motif.mk', 'compat/gimp-patches/**') }}

      - name: Cache ccache
        # Distinct key from motif/osiris/xfig so the GIMP .o set does not
        # collide with objects compiled with a different include path.
        uses: actions/cache@v6
        with:
          path: ~/.cache/ccache
          key: ccache-gimp-v2-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-gimp-v2-${{ runner.os }}-

      - name: Configure ccache
        run: |
          ccache --max-size=600M
          ccache --zero-stats
          echo "CC=ccache clang" >>"$GITHUB_ENV"

      - name: Build libX11-compat (prerequisite for GIMP)
        run: make -j"$(nproc)"

      - name: Build Motif libXm and libMrm (prerequisite for GIMP)
        run: make motif -j"$(nproc)"

      - name: Build GIMP 0.54 against compat stack
        id: gimp
        # mk/gimp-motif.mk fetches gimp-0.54.1.fixed.tar.gz, applies the
        # compat/gimp-patches/ balooii LP64 rework, stages the lib-aliases
        # symlink farm and merged include sysroot, runs the 1996 autoconf
        # build for app/gimp, then a second isolated make for the
        # image-format plug-ins. The recursive make is invoked with
        # built-in rules restored (the 1996 Makefiles depend on them).
        # Full log lives at build/gimp-motif/build.log, uploaded on failure.
        run: make gimp-motif -j"$(nproc)"

      - name: Run GIMP replay smoke check
        id: gimp-smoke
        # gimp-motif-startup launches app/gimp under an empty HOME (which
        # exercises the gimprc-default-build-paths patch) and asserts on
        # the rendered toolbox region. Display 124 is distinct from motif
        # (121), mosaic (122), and xfig (123) so a future shared runner
        # does not collide.
        if: ${{ !cancelled() && steps.gimp.outcome == 'success' }}
        env:
          UI_REPLAY_XVFB: --xvfb
          UI_REPLAY_SCREENSHOT_COMMAND: import
          UI_REPLAY_DISPLAY: 124
        run: make check-smoke-gimp-motif

      - name: Upload GIMP build log on failure
        if: ${{ failure() && steps.gimp.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: gimp-build-log
          path: build/gimp-motif/build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Upload UI smoke artifacts on failure
        # Distinct artifact name from the other jobs so concurrent uploads
        # do not overwrite each other.
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ui-smoke-gimp
          path: build/ui-smoke
          if-no-files-found: warn
          retention-days: 7

      - name: ccache stats
        if: ${{ !cancelled() }}
        run: ccache --show-stats

  # ---- GTK1 integration and validation ----
  #
  # GTK1 builds against libx11-compat with the compat/gtk1-patches/ stack.
  # Keep it separate from CinePaint so other GTK1 clients can reuse the same
  # CI workload shape.
  gtk1:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ${{ env.COMMON_BUILD_PKGS }} ${{ env.GTK1_BUILD_PKGS }} \
            ${{ env.DIFFERENTIAL_PKGS }}

      - name: Cache upstream tarballs and extracted source/headers
        uses: actions/cache@v6
        with:
          path: |
            build/upstream
            !build/upstream/**/*.o
            !build/upstream/**/*.d
            !build/upstream/motif
            !build/upstream/mosaic
            !build/upstream/osiris
            !build/upstream/xfig-*
            !build/upstream/.cache/xfig-*
            !build/upstream/gimp-*
            !build/upstream/.cache/gimp-*
            !build/upstream/gtk1
            !build/upstream/cinepaint
          key: upstream-src-v2-${{ runner.os }}-${{ hashFiles('scripts/sync-upstream-headers.py') }}
          restore-keys: |
            upstream-src-v2-${{ runner.os }}-

      - name: Cache GTK1 source clone
        uses: actions/cache@v6
        with:
          path: build/upstream/gtk1
          key: gtk1-src-${{ runner.os }}-${{ hashFiles('mk/gtk1.mk', 'compat/gtk1-patches/**') }}

      - name: Cache ccache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ccache
          key: ccache-gtk1-v1-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-gtk1-v1-${{ runner.os }}-

      - name: Configure ccache
        run: |
          ccache --max-size=512M
          ccache --zero-stats
          echo "CXX=g++" >>"$GITHUB_ENV"

      - name: Build GTK1 against compat stack
        id: gtk1
        run: make gtk1 -j"$(nproc)"

      - name: Run GTK1 replay check
        if: ${{ !cancelled() && steps.gtk1.outcome == 'success' }}
        env:
          UI_REPLAY_XVFB: --xvfb
          UI_REPLAY_SCREENSHOT_COMMAND: import
          UI_REPLAY_DISPLAY: 125
        run: make check-smoke-gtk1

      - name: Upload GTK1 build log on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: gtk1-build-log
          path: build/gtk1/build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Upload GTK1 UI smoke artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ui-smoke-gtk1
          path: build/ui-smoke/gtk1-smoke
          if-no-files-found: warn
          retention-days: 7

      - name: ccache stats
        if: ${{ !cancelled() }}
        run: ccache --show-stats

  # ---- CinePaint integration and validation ----
  #
  # CinePaint Hollywood builds against GTK1 as a make prerequisite. The replay
  # checks cover CinePaint startup, first-run, canvas, about, and PNG palette
  # flows, assert that no new WARN_UNIMPLEMENTED calls leaked into those paths,
  # and verify that editor/plugins do not link host libX11/libXext.
  #
  # There is no CinePaint system-libX11 differential target yet; this job
  # runs the available CI gates and stays in ci.yml.
  cinepaint:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ${{ env.COMMON_BUILD_PKGS }} ${{ env.CINEPAINT_BUILD_PKGS }} \
            ${{ env.DIFFERENTIAL_PKGS }}

      - name: Cache upstream tarballs and extracted source/headers
        uses: actions/cache@v6
        with:
          path: |
            build/upstream
            !build/upstream/**/*.o
            !build/upstream/**/*.d
            !build/upstream/motif
            !build/upstream/mosaic
            !build/upstream/osiris
            !build/upstream/xfig-*
            !build/upstream/.cache/xfig-*
            !build/upstream/gimp-*
            !build/upstream/.cache/gimp-*
            !build/upstream/gtk1
            !build/upstream/cinepaint
          key: upstream-src-v2-${{ runner.os }}-${{ hashFiles('scripts/sync-upstream-headers.py') }}
          restore-keys: |
            upstream-src-v2-${{ runner.os }}-

      - name: Cache GTK1 source clone
        uses: actions/cache@v6
        with:
          path: build/upstream/gtk1
          key: gtk1-src-${{ runner.os }}-${{ hashFiles('mk/gtk1.mk', 'compat/gtk1-patches/**') }}

      - name: Cache CinePaint source clone
        uses: actions/cache@v6
        with:
          path: build/upstream/cinepaint
          key: cinepaint-src-${{ runner.os }}-${{ hashFiles('mk/cinepaint.mk', 'compat/cinepaint-patches/**') }}

      - name: Cache ccache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ccache
          key: ccache-cinepaint-v1-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-cinepaint-v1-${{ runner.os }}-

      - name: Configure ccache
        run: |
          ccache --max-size=1024M
          ccache --zero-stats
          echo "CXX=g++" >>"$GITHUB_ENV"

      - name: Build CinePaint against compat stack
        id: cinepaint
        run: make cinepaint -j"$(nproc)"

      - name: Run CinePaint replay checks
        if: ${{ !cancelled() && steps.cinepaint.outcome == 'success' }}
        env:
          UI_REPLAY_XVFB: --xvfb
          UI_REPLAY_SCREENSHOT_COMMAND: import
          UI_REPLAY_DISPLAY: 125
        run: make check-cinepaint-no-unexpected-stubs check-cinepaint-no-host-x11

      - name: Upload GTK1 build log on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: cinepaint-gtk1-build-log
          path: build/gtk1/build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Upload CinePaint build log on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: cinepaint-build-log
          path: build/cinepaint/build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Upload CinePaint UI smoke artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ui-smoke-cinepaint
          path: build/ui-smoke
          if-no-files-found: warn
          retention-days: 7

      - name: ccache stats
        if: ${{ !cancelled() }}
        run: ccache --show-stats

  # ---- XMMS (GTK1 skinned audio player) integration and validation ----
  #
  # XMMS 1.2.x builds against the in-tree GTK1 port and libx11-compat, so it
  # reuses the same GTK1 build the cinepaint job exercises. On Linux the macOS
  # CoreAudio output plugin is compiled out; the disk_writer / tonegen / mpg123
  # plugins carry the build. check-xmms runs the offscreen startup and skinned-
  # window replays (in-process snapshots, no Xvfb), asserts no WARN_UNIMPLEMENTED
  # leaked into those paths, reports the SHAPE-mask hit-test / pixmap snapshot,
  # and verifies the player and its plugins do not link host libX11/libXext. The
  # system-X11 screenshot differential lives in differential.yml.
  xmms:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install build dependencies
        # GTK1_BUILD_PKGS carries cmake + g++ for the GTK1 CMake build (an XMMS
        # prerequisite) and python3-pil for the replay image assertions. XMMS's
        # own audio plugins (disk_writer / tonegen / mpg123) build from its
        # bundled source, so no system audio dev libraries are needed. ripgrep
        # backs the check-xmms host-link and shape-pixmap gates, which call rg
        # directly (the runner image does not ship it).
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ${{ env.COMMON_BUILD_PKGS }} ${{ env.GTK1_BUILD_PKGS }} ripgrep

      - name: Cache upstream tarballs and extracted source/headers
        uses: actions/cache@v6
        with:
          path: |
            build/upstream
            !build/upstream/**/*.o
            !build/upstream/**/*.d
            !build/upstream/motif
            !build/upstream/mosaic
            !build/upstream/osiris
            !build/upstream/xfig-*
            !build/upstream/.cache/xfig-*
            !build/upstream/gimp-*
            !build/upstream/.cache/gimp-*
            !build/upstream/gtk1
            !build/upstream/xmms
          key: upstream-src-v2-${{ runner.os }}-${{ hashFiles('scripts/sync-upstream-headers.py') }}
          restore-keys: |
            upstream-src-v2-${{ runner.os }}-

      - name: Cache GTK1 source clone
        uses: actions/cache@v6
        with:
          path: build/upstream/gtk1
          key: gtk1-src-${{ runner.os }}-${{ hashFiles('mk/gtk1.mk', 'compat/gtk1-patches/**') }}

      - name: Cache XMMS source clone
        uses: actions/cache@v6
        with:
          path: build/upstream/xmms
          key: xmms-src-${{ runner.os }}-${{ hashFiles('mk/xmms.mk', 'compat/xmms-patches/**') }}

      - name: Cache ccache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ccache
          key: ccache-xmms-v1-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-xmms-v1-${{ runner.os }}-

      - name: Configure ccache
        run: |
          ccache --max-size=1024M
          ccache --zero-stats
          echo "CXX=g++" >>"$GITHUB_ENV"

      - name: Build XMMS against compat stack
        id: xmms
        run: make xmms -j"$(nproc)"

      - name: Run XMMS replay and host-link checks
        # check-xmms bundles the offscreen startup/window replays, the
        # no-unexpected-stubs gate, the shape-pixmap report, and the no-host-x11
        # link check. The replays run in-process and offscreen, so no Xvfb or
        # screenshot tool is needed. no-host-x11 whitelists the versioned base
        # sonames libX11.so.6 / libXext.so.6 that a GTK1 client pulls in
        # transitively on Linux while still flagging libXi / libXrender and
        # unexpected host libraries (see mk/xmms.mk).
        if: ${{ !cancelled() && steps.xmms.outcome == 'success' }}
        run: make check-xmms

      - name: Upload GTK1 build log on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: xmms-gtk1-build-log
          path: build/gtk1/build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Upload XMMS build log on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: xmms-build-log
          path: build/xmms/build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Upload XMMS UI smoke artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ui-smoke-xmms
          path: build/ui-smoke
          if-no-files-found: warn
          retention-days: 7

      - name: ccache stats
        if: ${{ !cancelled() }}
        run: ccache --show-stats

  # ---- Grace (Motif 2D plotting) integration and validation ----
  #
  # Grace 5.1.25 (xmgrace) builds against the bundled thentenaar/motif plus
  # libXt-compat, libXmu-compat, and libX11-compat, with the compat/grace-patches/
  # set applied. `make grace` pulls in the bundled Motif build as a prerequisite,
  # so this job carries the MOTIF_BUILD_PKGS autoreconf chain and the MOTIF_YACC
  # override like the motif / gimp / xephem jobs.
  #
  # This job builds Grace and validates its runtime with the -hardcopy PostScript
  # export under Xvfb (Grace calls XOpenDisplay(NULL) directly at startup and does
  # not come up under SDL's dummy driver on a headless Linux runner, so it needs a
  # real display). The interactive replay smoke is a local-only tool here (see the
  # note on the export step). Grace's GUI rendering is gated by the screenshot
  # differential vs system OpenMotif under Xvfb (grace-differential in
  # differential.yml).
  grace:
    runs-on: ubuntu-24.04
    env:
      # Same bison yacc-compat shim the motif / gimp jobs use for the Mrm
      # parser generation; the bundled Motif is a build prerequisite of Grace.
      MOTIF_YACC: "bison -y"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install build dependencies
        # DIFFERENTIAL_PKGS supplies Xvfb, the import screenshot tool, and
        # python3-pil for the replay smoke's image assertions (GRACE_BUILD_PKGS
        # also carries python3-pil, kept for parity with the other workload jobs).
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ${{ env.COMMON_BUILD_PKGS }} ${{ env.MOTIF_BUILD_PKGS }} \
            ${{ env.GRACE_BUILD_PKGS }} ${{ env.DIFFERENTIAL_PKGS }}

      - name: Cache upstream tarballs and extracted source/headers
        # Exclude the Grace tarball + extracted tree so the dedicated grace-src
        # cache below owns them, matching how the other big source trees split out.
        uses: actions/cache@v6
        with:
          path: |
            build/upstream
            !build/upstream/**/*.o
            !build/upstream/**/*.d
            !build/upstream/motif
            !build/upstream/mosaic
            !build/upstream/osiris
            !build/upstream/xfig-*
            !build/upstream/.cache/xfig-*
            !build/upstream/gimp-*
            !build/upstream/.cache/gimp-*
            !build/upstream/grace-*
            !build/upstream/.cache/grace-*
          key: upstream-src-v2-${{ runner.os }}-${{ hashFiles('scripts/sync-upstream-headers.py') }}
          restore-keys: |
            upstream-src-v2-${{ runner.os }}-

      - name: Cache Motif source clone and autoreconf output
        # Grace reuses the in-tree thentenaar/motif as its libXm/libMrm provider,
        # so cache the same clone+autoreconf the motif job does. Exact-match key
        # only, matching the motif job's rationale.
        uses: actions/cache@v6
        with:
          path: build/upstream/motif
          key: motif-src-${{ runner.os }}-${{ hashFiles('mk/motif.mk', 'compat/motif-patches/**') }}

      - name: Cache Grace source tree
        # Exact-match key only. GRACE_VERSION / GRACE_SHA256 in mk/grace.mk pin
        # the tarball, and the compat/grace-patches/ set is applied to a throwaway
        # work tree (build/grace/source), so the extracted tree here stays
        # pristine. Cache the tarball too so a hit avoids re-download + re-extract.
        uses: actions/cache@v6
        with:
          path: |
            build/upstream/grace-5.1.25
            build/upstream/.cache/grace-5.1.25.tar.gz
          key: grace-src-${{ runner.os }}-${{ hashFiles('mk/grace.mk', 'compat/grace-patches/**') }}

      - name: Cache ccache
        # Distinct key from motif / gimp so the Grace .o set does not collide
        # with objects compiled against a different include path.
        uses: actions/cache@v6
        with:
          path: ~/.cache/ccache
          key: ccache-grace-v1-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-grace-v1-${{ runner.os }}-

      - name: Configure ccache
        run: |
          ccache --max-size=600M
          ccache --zero-stats
          echo "CC=ccache clang" >>"$GITHUB_ENV"

      - name: Build libX11-compat (prerequisite for Grace)
        # Prime the upstream stamp serially before fanning out, matching the
        # xephem / xwpe jobs: on a cold cache a parallel `make -j` can start
        # compiling build/upstream/src/*.o before the upstream sync recipe has
        # written those .c files.
        run: |
          make build/upstream/include/.upstream-stamp
          make -j"$(nproc)"

      - name: Build Motif libXm and libMrm (prerequisite for Grace)
        run: make motif -j"$(nproc)"

      - name: Build Grace against compat stack
        id: grace
        # mk/grace.mk fetches grace-5.1.25 from the Debian mirror, applies the
        # compat/grace-patches/ set, stages the lib-aliases symlink farm and a
        # merged Motif + compat include sysroot, and runs Grace's own configure
        # (netcdf / jpeg / png / pdf drivers and the f77 wrapper disabled, bundled
        # t1lib). The full log lives at build/grace/build.log, uploaded on failure.
        run: make grace -j"$(nproc)"

      # The interactive replay smoke (check-smoke-grace) is not run here. It
      # relies on libx11-compat's in-process snapshot mechanism, which needs the
      # client event loop to service a capture request between frames. Grace's
      # plot canvas repaints continuously under a live X display (Xvfb on the
      # runner), starving that request so the snapshot never lands; the same
      # busy loop is why wait-converge never quiets. It works locally under SDL's
      # offscreen dummy driver, where Grace idles, so it stays a local tool. On
      # Linux Grace's runtime is gated by the -hardcopy export below (its full
      # canvas + font render path) and by the screenshot differential vs system
      # OpenMotif under Xvfb (grace-differential in differential.yml), which uses
      # real screen captures rather than in-process snapshots.

      - name: Run Grace PostScript export check
        # Renders the fixture to PostScript with -hardcopy and asserts a non-empty
        # file with a valid %!PS header. Run under Xvfb with GRACE_HARDCOPY_ENV
        # cleared so SDL binds its x11 backend to the Xvfb server (Grace does not
        # come up under the dummy driver on a headless Linux runner).
        if: ${{ !cancelled() && steps.grace.outcome == 'success' }}
        run: xvfb-run -a make check-grace-export GRACE_HARDCOPY_ENV=

      - name: Upload Grace build log on failure
        if: ${{ failure() && steps.grace.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: grace-build-log
          path: build/grace/build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Upload UI smoke artifacts on failure
        # Distinct artifact name so concurrent workload uploads do not overwrite.
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ui-smoke-grace
          path: build/ui-smoke
          if-no-files-found: warn
          retention-days: 7

      - name: ccache stats
        if: ${{ !cancelled() }}
        run: ccache --show-stats

  # ---- Magic VLSI layout startup smoke ----
  # Builds a repo-private Tcl/TkX11 8.6.10 plus RTimothyEdwards/magic against
  # libx11-compat and runs the replay-driven layout startup smoke. Kept in its
  # own job (like mosaic) so the heavier, network-dependent private Tcl/Tk plus
  # Magic build does not slow the core PR gate. No Xvfb: the smoke drives SDL's
  # offscreen dummy driver and captures via the in-process snapshot path.
  # MAGIC_OPENGL=0 gates the 2D TkX11 layout window, not the optional 3D OpenGL
  # display. Built with gcc, matching the local and node11 validation; Magic
  # 8.3's pre-C99 idioms are already softened to warnings for it.
  magic:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install build dependencies
        # python3-pil backs the smoke's image assertions (magic-layout-visible /
        # magic-layout-resized). SDL2 stack plus pixman is the compat boundary.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc ccache make pkg-config python3 python3-pil \
            libsdl2-dev libsdl2-ttf-dev libpixman-1-dev

      - name: Cache upstream sources, Tcl/Tk tarballs, and Magic clone
        # One cache over build/upstream covers the staged upstream headers, the
        # private Tcl/Tk source tarballs, and the pinned Magic checkout. Keyed on
        # the fragments that pin them so a patch or revision bump re-primes it.
        uses: actions/cache@v6
        with:
          path: |
            build/upstream
            !build/upstream/**/*.o
            !build/upstream/**/*.d
          key: magic-upstream-v1-${{ runner.os }}-${{ hashFiles('mk/magic.mk', 'mk/tcltk.mk', 'compat/magic-patches/**', 'scripts/sync-upstream-headers.py') }}
          restore-keys: |
            magic-upstream-v1-${{ runner.os }}-

      - name: Cache ccache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ccache
          key: ccache-magic-v1-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-magic-v1-${{ runner.os }}-

      - name: Configure ccache
        run: |
          ccache --max-size=800M
          ccache --zero-stats
          echo "CC=ccache gcc" >>"$GITHUB_ENV"

      - name: Build libX11-compat (prerequisite for Magic)
        # Prime the upstream stamp serially before the parallel build, matching
        # the other workload jobs on a cold cache.
        run: |
          make build/upstream/include/.upstream-stamp
          make -j"$(nproc)"

      - name: Build Magic and run the layout startup smoke
        id: magic
        # check-magic-no-unexpected-stubs builds the private Tcl/Tk plus Magic,
        # runs the magic-startup replay (loads the fixture, asserts the scmos
        # layer fills render, then resizes and re-renders), and scans the log for
        # unexpected unimplemented Xlib calls. Not parallelized: Magic's autotools
        # build is not -j clean.
        run: make check-magic-no-unexpected-stubs MAGIC_OPENGL=0

      - name: Upload Magic UI smoke artifacts on failure
        if: ${{ failure() && steps.magic.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: magic-ui-smoke
          path: build/ui-smoke/magic-startup
          if-no-files-found: warn
          retention-days: 7

      - name: ccache stats
        if: ${{ !cancelled() }}
        run: ccache --show-stats

  # ---- Micropolis (bundled Tcl/Tk/TclX) build + compat-link gate ----
  # Builds stargo/micropolis with its in-tree Tcl/Tk/TclX against libx11-compat
  # so the compat XShm / XPutImage / Xlib surface it links stays intact: a
  # compat API or symbol regression that breaks the port is caught here at build
  # and link time. Kept in its own job (like magic/mosaic) so the bundled
  # interpreter build stays out of the core PR gate. The runtime replay smokes
  # (make micropolis-check) assert macOS/SDL3 window geometry and are validated
  # there; the compat's own check-unit covers the XShm behavior on Linux.
  micropolis:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install build dependencies
        # python3-pil backs the smoke's image assertions; byacc builds the
        # bundled TclX parser; SDL2 stack plus pixman is the compat boundary.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc ccache make pkg-config python3 python3-pil byacc \
            libsdl2-dev libsdl2-ttf-dev libpixman-1-dev

      - name: Cache upstream sources and Micropolis clone
        uses: actions/cache@v6
        with:
          path: |
            build/upstream
            !build/upstream/**/*.o
            !build/upstream/**/*.d
          key: micropolis-upstream-v1-${{ runner.os }}-${{ hashFiles('mk/micropolis.mk', 'compat/micropolis-patches/**', 'scripts/sync-upstream-headers.py') }}
          restore-keys: |
            micropolis-upstream-v1-${{ runner.os }}-

      - name: Cache ccache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ccache
          key: ccache-micropolis-v1-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-micropolis-v1-${{ runner.os }}-

      - name: Configure ccache
        # Micropolis's cc-legacy wrapper execs "$CC" as a single program, so CC
        # must be one word. Route ccache through its masquerade directory on
        # PATH instead of CC="ccache gcc", which cc-legacy would exec verbatim.
        run: |
          ccache --max-size=800M
          ccache --zero-stats
          echo "/usr/lib/ccache" >>"$GITHUB_PATH"
          echo "CC=gcc" >>"$GITHUB_ENV"

      - name: Build libX11-compat (prerequisite for Micropolis)
        # Prime the upstream stamp serially before the parallel build, matching
        # the other workload jobs on a cold cache.
        run: |
          make build/upstream/include/.upstream-stamp
          make -j"$(nproc)"

      - name: Build Micropolis against the compat stack
        id: micropolis
        run: make micropolis

      - name: Upload Micropolis build log on failure
        if: ${{ failure() && steps.micropolis.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: micropolis-build-log
          path: build/micropolis/build.log
          if-no-files-found: warn
          retention-days: 7

      - name: ccache stats
        if: ${{ !cancelled() }}
        run: ccache --show-stats

  # ---- Native SDL3 backend build + regression tests ----
  # ubuntu-24.04 ships no SDL3 in its repos (SDL3 GA'd after noble), and no
  # GitHub runner image or readily-available PPA carries libsdl3-dev for
  # noble (the savoury1 multimedia PPA, for instance, packages only SDL2),
  # so build SDL3 + SDL3_ttf from their latest stable release-3.2.* tags
  # into a cached prefix, then build the compat stack with SDL_BACKEND=sdl3
  # and run the sanitizer-friendly regression subset. This is the only job
  # that exercises the native-SDL3 translation shim (src/sdl-compat.h).
  sdl3:
    runs-on: ubuntu-24.04
    env:
      SDL3_PREFIX: ${{ github.workspace }}/.sdl3-prefix
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install build dependencies
        # cmake/ninja drive the SDL3 source build; freetype/harfbuzz back
        # SDL3_ttf (built with SDLTTF_VENDORED=OFF). No libsdl2-dev: the SDL3
        # backend links the libSDL3 / libSDL3_ttf built below directly.
        #
        # libx11-dev is still needed: the staged upstream libXt/libX11 sources
        # fall through to a few system X11 protocol/private headers (e.g.
        # X11/Xpoll.h) that the compat header tree does not stage. The other
        # jobs pull these in transitively via libsdl2-dev -> libx11-dev; this
        # job has no SDL2, so install libx11-dev explicitly.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang ccache make pkg-config python3 libpixman-1-dev \
            cmake ninja-build git libfreetype-dev libharfbuzz-dev libx11-dev

      - name: Cache SDL3 + SDL3_ttf prefix
        id: sdl3-cache
        uses: actions/cache@v6
        with:
          path: ${{ env.SDL3_PREFIX }}
          key: sdl3-src-prefix-v1-${{ runner.os }}

      - name: Build SDL3 + SDL3_ttf from source
        if: steps.sdl3-cache.outputs.cache-hit != 'true'
        # --filter=blob:none keeps history + tags cheap so the latest stable
        # release-3.2.* tag can be selected without a full checkout.
        # SDL_UNIX_CONSOLE_BUILD=ON builds the dummy/offscreen video drivers
        # without requiring X11 or Wayland development libraries; the compat
        # regression tests run under SDL_VIDEODRIVER=dummy with the software
        # renderer, so no real windowing backend is needed in CI.
        run: |
          set -eux
          tmp="$(mktemp -d)"
          git clone --filter=blob:none --no-checkout \
            https://github.com/libsdl-org/SDL.git "$tmp/SDL"
          git -C "$tmp/SDL" checkout \
            "$(git -C "$tmp/SDL" tag -l 'release-3.2.*' | sort -V | tail -1)"
          cmake -S "$tmp/SDL" -B "$tmp/SDL/b" -G Ninja \
            -DCMAKE_INSTALL_PREFIX="$SDL3_PREFIX" -DCMAKE_BUILD_TYPE=Release \
            -DSDL_SHARED=ON -DSDL_STATIC=OFF -DSDL_TEST_LIBRARY=OFF \
            -DSDL_UNIX_CONSOLE_BUILD=ON
          cmake --build "$tmp/SDL/b"
          cmake --install "$tmp/SDL/b"
          git clone --filter=blob:none --no-checkout \
            https://github.com/libsdl-org/SDL_ttf.git "$tmp/SDL_ttf"
          git -C "$tmp/SDL_ttf" checkout \
            "$(git -C "$tmp/SDL_ttf" tag -l 'release-3.2.*' | sort -V | tail -1)"
          cmake -S "$tmp/SDL_ttf" -B "$tmp/SDL_ttf/b" -G Ninja \
            -DCMAKE_INSTALL_PREFIX="$SDL3_PREFIX" -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$SDL3_PREFIX" -DBUILD_SHARED_LIBS=ON \
            -DSDLTTF_VENDORED=OFF -DSDLTTF_SAMPLES=OFF
          cmake --build "$tmp/SDL_ttf/b"
          cmake --install "$tmp/SDL_ttf/b"
          rm -rf "$tmp"

      - name: Cache upstream tarballs and extracted source/headers
        uses: actions/cache@v6
        with:
          path: |
            build/upstream
            !build/upstream/**/*.o
            !build/upstream/**/*.d
            !build/upstream/motif
            !build/upstream/mosaic
            !build/upstream/osiris
            !build/upstream/xfig-*
            !build/upstream/.cache/xfig-*
            !build/upstream/gimp-*
            !build/upstream/.cache/gimp-*
          key: upstream-src-v2-${{ runner.os }}-${{ hashFiles('scripts/sync-upstream-headers.py') }}
          restore-keys: |
            upstream-src-v2-${{ runner.os }}-

      - name: Cache ccache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ccache
          key: ccache-sdl3-v1-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-sdl3-v1-${{ runner.os }}-

      - name: Configure ccache and SDL3 environment
        # PKG_CONFIG_PATH lets the build auto-detect sdl3/sdl3-ttf from the
        # prefix; LD_LIBRARY_PATH lets the test binaries find libSDL3 at
        # runtime. Both lib and lib64 are covered regardless of the prefix's
        # GNUInstallDirs layout.
        run: |
          ccache --max-size=400M
          ccache --zero-stats
          {
            echo "CC=ccache clang"
            echo "PKG_CONFIG_PATH=$SDL3_PREFIX/lib/pkgconfig:$SDL3_PREFIX/lib64/pkgconfig"
            echo "LD_LIBRARY_PATH=$SDL3_PREFIX/lib:$SDL3_PREFIX/lib64"
          } >>"$GITHUB_ENV"

      - name: Confirm SDL3 is detected
        run: |
          pkg-config --exists sdl3 sdl3-ttf
          echo "SDL3 $(pkg-config --modversion sdl3), SDL3_ttf $(pkg-config --modversion sdl3-ttf)"

      - name: Build libX11-compat.so (SDL_BACKEND=sdl3)
        run: make SDL_BACKEND=sdl3 -j"$(nproc)"

      - name: Run regression tests (SDL_BACKEND=sdl3 make check-unit)
        # check-unit runs the in-tree binaries headless (SDL_VIDEODRIVER=
        # dummy, software renderer) plus symbol coverage; it does not need
        # Xvfb. The make test runner also folds SDL_RUNTIME_LIBDIR (the sdl3
        # pkg-config libdir) onto LD_LIBRARY_PATH so libSDL3 resolves.
        run: make SDL_BACKEND=sdl3 check-unit

      - name: Build bundled examples (SDL_BACKEND=sdl3)
        run: make SDL_BACKEND=sdl3 examples -j"$(nproc)"

      - name: ccache stats
        if: ${{ !cancelled() }}
        run: ccache --show-stats
